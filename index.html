<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"
    content="black-translucent">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
  
  <!-- Font Awesome Icons for YouTube Style Arrows & Settings -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none
    }

    #channel-list {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      z-index: 9998;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom))
    }

    #channel-list h1 {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .5px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #141414;
      text-align: center
    }

    #ch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px
    }

    .ch-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 22px 16px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all .25s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2)
    }

    .ch-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: #2962ff;
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(56, 189, 248, 0.15)
    }
    
    .ch-card:active {
      transform: scale(.97);
      background: rgba(255, 255, 255, 0.1)
    }

    .ch-card:focus-visible {
      outline: 2px solid #2962ff;
      outline-offset: 3px
    }

    .ch-card span {
      color: #e0e0e0;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4
    }

    #pc {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      align-items: center;
      justify-content: center;
      touch-action: manipulation
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      will-change: transform
    }

    video.mode-fill {
      object-fit: fill
    }

    video.mode-cover {
      object-fit: cover
    }

    #status {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 9997;
      padding: 5px 13px;
      background: rgba(8, 8, 8, .9);
      border: 1px solid rgba(255, 255, 255, .05);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .02em;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
      max-width: 260px;
      text-align: right;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px)
    }

    #status.show {
      opacity: 1
    }

    #status.ok {
      color: #2962ff
    }

    #status.warn {
      color: #2962ff
    }

    #status.err {
      color: #2962ff
    }

    .sp-btn {
      background: transparent !important;
      border: none !important;
      cursor: pointer !important;
      padding: 0 8px !important;
      opacity: .8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 100%;
      min-width: 36px;
      transition: opacity .15s, color .15s;
      color: #fff !important;
      -webkit-tap-highlight-color: transparent
    }

    .sp-btn:hover {
      opacity: 1
    }

    .sp-btn:active {
      opacity: 1;
      transform: scale(.92)
    }

    .sp-btn:focus-visible {
      outline: 2px solid #2962ff;
      outline-offset: 2px;
      border-radius: 6px
    }

    .sp-btn svg {
      width: 18px;
      height: 18px;
      display: block;
      pointer-events: none;
      flex-shrink: 0
    }

    .sp-btn.active {
      opacity: 1;
      color: #2962ff !important
    }

    .shaka-controls-container button {
      color: #fff !important
    }

    .shaka-video-container {
      background-color: #000 !important
    }

    @media (max-width:400px) {
      .sp-btn {
        padding: 0 6px !important;
        gap: 3px
      }
    }

    /* Dim Screen Overlay */
    #brightness-overlay {
      position: absolute;
      inset: 0;
      background: black;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
    }

    /* Vertical Gestures HUD (Khada Bar) */
    .vertical-hud {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10000;
      pointer-events: none;
    }

    #hud-brightness {
      left: 10%;
    }

    #hud-volume {
      right: 10%;
    }

    .vertical-hud i {
      font-size: 15px;
      color: #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    /* Vertical Progress Bar Container */
    .hud-vertical-bar {
      width: 4px;
      height: 130px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .hud-vertical-fill {
      width: 100%;
      height: 0%;
      background: #ffffff;
      border-radius: 4px;
      transition: height 0.05s ease-out;
    }

    /* YouTube Style Double Tap Seek Overlay */
    .youtube-seek-hud {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      pointer-events: none;
      color: #ffffff;
      gap: 6px;
    }

    #seek-left {
      left: 0;
      border-radius: 0 100% 100% 0 / 0 50% 50% 0;
    }

    #seek-right {
      right: 0;
      border-radius: 100% 0 0 100% / 50% 0 0 50%;
    }

    .yt-arrows {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 16px;
    }

    /* Animated Triple Arrows */
    .yt-arrows i {
      animation: ytArrowFade 0.8s infinite ease-in-out;
    }

    .yt-arrows i:nth-child(1) { animation-delay: 0s; }
    .yt-arrows i:nth-child(2) { animation-delay: 0.15s; }
    .yt-arrows i:nth-child(3) { animation-delay: 0.3s; }

    @keyframes ytArrowFade {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .yt-seek-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Animated Entry Lock Container (Zoom In / Bounce Animation on Tap) */
    #floating-lock-container {
      position: absolute;
      left: max(16px, env(safe-area-inset-left));
      top: max(16px, env(safe-area-inset-top));
      z-index: 10001;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.5) translateY(-20px);
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Tap Par Show Animation */
    #floating-lock-container.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
    }

    /* Side Text Label */
    .lock-side-label {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(41, 98, 255, 0.6);
      color: #ffffff;
      font-size: clamp(12px, 1.8vw, 14px);
      font-weight: 600;
      padding: clamp(6px, 1vw, 9px) clamp(12px, 1.8vw, 16px);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    /* Animated Floating Lock Button */
    #floating-lock-btn {
      width: clamp(42px, 5.5vw, 54px);
      height: clamp(42px, 5.5vw, 54px);
      background: rgba(15, 23, 42, 0.88);
      border: 1.5px solid rgba(41, 98, 255, 0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease;
      box-shadow: 0 0 12px rgba(41, 98, 255, 0.4);
      animation: lockBackgroundPulse 2s infinite ease-in-out;
    }

    @keyframes lockBackgroundPulse {
      0%, 100% {
        background-color: rgba(15, 23, 42, 0.88);
        box-shadow: 0 0 8px rgba(41, 98, 255, 0.3);
      }
      50% {
        background-color: rgba(41, 98, 255, 0.35);
        box-shadow: 0 0 20px rgba(41, 98, 255, 0.8);
      }
    }

    #floating-lock-btn:active {
      transform: scale(0.9);
    }

    #floating-lock-btn svg {
      width: clamp(20px, 2.5vw, 24px);
      height: clamp(20px, 2.5vw, 24px);
      fill: #2962ff;
      filter: drop-shadow(0 0 4px rgba(41, 98, 255, 0.8));
    }

    /* OTT / JioCinema Style Tabbed Settings Modal */
    .ott-settings-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10008;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .ott-settings-modal.show {
      display: flex;
      opacity: 1;
    }

    .ott-settings-box {
      width: min(90%, 540px);
      max-height: 85vh;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* Fixed Top Header Container for Tabs & Close Button */
    .ott-settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
      position: relative;
      padding-right: 48px; /* Close button space */
    }

    .ott-settings-nav {
      display: flex;
      align-items: center;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 10px;
      width: 100%;
    }

    .ott-settings-nav::-webkit-scrollbar {
      display: none;
    }

    .ott-nav-tab {
      padding: 16px 18px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .ott-nav-tab:hover {
      color: #f8fafc;
    }

    .ott-nav-tab.active {
      color: #ffffff;
      border-bottom-color: #2962ff;
    }

    /* Fixed Position Close Button */
    .ott-settings-close {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s;
      z-index: 10;
    }

    .ott-settings-close:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .ott-settings-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 320px;
    }

    .ott-settings-body::-webkit-scrollbar {
      width: 5px;
    }
    .ott-settings-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .ott-section-title {
      font-size: 11px;
      color: #2962ff;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-top: 6px;
      margin-bottom: 2px;
    }

    .ott-option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ott-option-row:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(41, 98, 255, 0.3);
    }

    .ott-option-row.active {
      background: rgba(41, 98, 255, 0.15);
      border-color: #2962ff;
    }

    .ott-option-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ott-option-title {
      color: #f8fafc;
      font-size: 14px;
      font-weight: 600;
    }

    .ott-option-sub {
      color: #94a3b8;
      font-size: 11px;
    }

    .ott-option-check {
      color: #2962ff;
      font-size: 16px;
      visibility: hidden;
    }

    .ott-option-row.active .ott-option-check {
      visibility: visible;
    }

    /* Hide Shaka Default Quality Button */
    .shaka-quality-button {
      display: none !important;
    }

    /* Orientation Media Query Fixes */
    @media (orientation: portrait) {
      #floating-lock-container {
        left: max(12px, env(safe-area-inset-left));
        top: max(12px, env(safe-area-inset-top));
      }
      .lock-side-label {
        font-size: 12px;
        padding: 6px 12px;
      }
      #floating-lock-btn {
        width: 44px;
        height: 44px;
      }
      #floating-lock-btn svg {
        width: 20px;
        height: 20px;
      }
    }

    .controls-locked .shaka-controls-container {
      display: none !important;
    }
  </style>
  
  <style>
    .custom-watermark {
      position: absolute;
      z-index: 40;
      pointer-events: none;
      top: 65%;
      left: 11%;
      transform: translateY(-50%);
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.12);
    }
    
    .custom-watermark img {
      height: 52px;
      width: 52px;
      opacity: 80%;
    }
    
    @media (max-width: 700px) {
      .custom-watermark {
        font-size: 9px;
        top: 58%;
        left: 4%;
      }
      
      .custom-watermark img {
        height: 45px;
        width: 45px;
        opacity: 80%;
      }
    }
  </style>
</head>

<body>
  <div id="status"></div>
  <div id="channel-list">
    <h1>cricketlive.site</h1>
    <div id="ch-grid"></div>
  </div>
  
  <div id="pc">
    <div id="brightness-overlay"></div>
    
    <!-- Vertical Brightness HUD -->
    <div id="hud-brightness" class="vertical-hud">
      <i class="fa-regular fa-sun"></i>
      <div class="hud-vertical-bar">
        <div id="hud-brightness-fill" class="hud-vertical-fill"></div>
      </div>
    </div>

    <!-- Vertical Volume HUD -->
    <div id="hud-volume" class="vertical-hud">
      <i id="hud-vol-icon" class="fa-solid fa-volume-high"></i>
      <div class="hud-vertical-bar">
        <div id="hud-volume-fill" class="hud-vertical-fill"></div>
      </div>
    </div>

    <!-- YouTube Style Double Tap Seek Indicators with Animated Arrows -->
    <div id="seek-left" class="youtube-seek-hud">
      <div class="yt-arrows">
        <i class="fa-solid fa-chevron-left"></i>
        <i class="fa-solid fa-chevron-left"></i>
        <i class="fa-solid fa-chevron-left"></i>
      </div>
      <span id="seek-left-text" class="yt-seek-text">-10</span>
    </div>

    <div id="seek-right" class="youtube-seek-hud">
      <div class="yt-arrows">
        <i class="fa-solid fa-chevron-right"></i>
        <i class="fa-solid fa-chevron-right"></i>
        <i class="fa-solid fa-chevron-right"></i>
      </div>
      <span id="seek-right-text" class="yt-seek-text">+10</span>
    </div>

    <!-- Top-Left Floating Lock Container -->
    <div id="floating-lock-container">
      <div id="floating-lock-btn">
        <svg viewBox="0 0 24 24">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
        </svg>
      </div>
      <div class="lock-side-label">Tap to Unlock</div>
    </div>

    <!-- OTT Tabbed Settings Modal -->
    <div id="ott-settings-modal" class="ott-settings-modal">
      <div class="ott-settings-box">
        <div class="ott-settings-header">
          <div class="ott-settings-nav">
            <div class="ott-nav-tab active" data-tab="quality">Quality</div>
            <div class="ott-nav-tab" data-tab="speed">Playback Speed</div>
          </div>
          <span id="ott-modal-close" class="ott-settings-close">×</span>
        </div>
        <div id="ott-settings-body" class="ott-settings-body"></div>
      </div>
    </div>

    <video id="v" playsinline webkit-playsinline preload="none"
      x5-video-player-type="h5" x5-video-player-fullscreen="true"></video>
    <div class="custom-watermark"><img src="https://i.postimg.cc/SNjy16J7/cricketlive.png"></div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js">
  </script>
  <script>
    (function() {
      "use strict";

      var API = "https://sonujson-v3.pages.dev/Data/sports.json";

      var $status = document.getElementById("status");
      var $list = document.getElementById("channel-list");
      var $grid = document.getElementById("ch-grid");
      var $pc = document.getElementById("pc");
      var $vid = document.getElementById("v");
      var floatLockContainer = document.getElementById("floating-lock-container");
      var floatLock = document.getElementById("floating-lock-btn");

      var ottModal = document.getElementById("ott-settings-modal");
      var ottBody = document.getElementById("ott-settings-body");
      var ottClose = document.getElementById("ott-modal-close");
      var currentTab = "quality";

      var _stTmr = null;

      var isInterfaceLocked = false;
      var lockHideTimer = null;

      // Language Name Code Map
      var langMap = {
        'hi': 'Hindi',
        'en': 'English',
        'ta': 'Tamil',
        'te': 'Telugu',
        'bn': 'Bengali',
        'mr': 'Marathi',
        'kan': 'Kannada',
        'kn': 'Kannada',
        'mal': 'Malayalam',
        'ml': 'Malayalam',
        'gu': 'Gujarati',
        'pa': 'Punjabi',
        'or': 'Odia',
        'und': 'Default Stream Audio'
      };

      function getLangName(code) {
        if (!code) return "Default Audio";
        var c = code.toLowerCase().split('-')[0];
        return langMap[c] || code.toUpperCase();
      }

      // Web Audio API Setup (Volume Boost Engine)
      var audioCtx = null;
      var gainNode = null;
      var sourceNode = null;

      function initializeAudioEngine(video) {
        if (audioCtx) {
          if (audioCtx.state === "suspended") {
            audioCtx.resume().catch(function() {});
          }
          return;
        }
        try {
          var AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
          sourceNode = audioCtx.createMediaElementSource(video);
          gainNode = audioCtx.createGain();
          sourceNode.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          if (audioCtx.state === "suspended") {
            audioCtx.resume().catch(function() {});
          }
        } catch (e) {}
      }

      function setBoostedVolume(level) {
        if (gainNode && audioCtx) {
          if (audioCtx.state === "suspended") audioCtx.resume();
          gainNode.gain.value = level;
        }
      }

      function showFloatingLockTemp() {
        if (!floatLockContainer) return;
        floatLockContainer.classList.add("show");
        if (lockHideTimer) clearTimeout(lockHideTimer);
        lockHideTimer = setTimeout(function() {
          floatLockContainer.classList.remove("show");
        }, 3000);
      }

      // ----------------------------------------------------
      // OTT Settings Modal Handler (Quality, Speed, Subtitles)
      // ----------------------------------------------------
      function setupOttSettings(player) {
        if (!ottModal || !ottBody) return;

        // Close button handler
        if (ottClose) {
          ottClose.onclick = function(e) {
            e.stopPropagation();
            ottModal.classList.remove("show");
          };
        }

        // Tap outside box to close
        ottModal.onclick = function(e) {
          if (e.target === ottModal) {
            ottModal.classList.remove("show");
          }
        };

        // Tab switches
        var tabs = ottModal.querySelectorAll(".ott-nav-tab");
        tabs.forEach(function(tab) {
          tab.onclick = function(e) {
            e.stopPropagation();
            tabs.forEach(function(t) { t.classList.remove("active"); });
            tab.classList.add("active");
            currentTab = tab.getAttribute("data-tab");
            renderTabContent(player);
          };
        });

        function renderTabContent(player) {
          ottBody.innerHTML = "";

          if (currentTab === "quality") {
            var tracks = player.getVariantTracks();
            var isAbr = player.getConfiguration().abr.enabled;

            // Auto Row
            var autoRow = document.createElement("div");
            autoRow.className = "ott-option-row" + (isAbr ? " active" : "");
            autoRow.innerHTML = `
              <div class="ott-option-text">
                <div class="ott-option-title">Auto</div>
                <div class="ott-option-sub">Recommended for best experience</div>
              </div>
              <div class="ott-option-check"><i class="fa-solid fa-check"></i></div>
            `;
            autoRow.onclick = function(e) {
              e.stopPropagation();
              player.configure({ abr: { enabled: true } });
              toast("Quality set to Auto", "ok", 2000);
              renderTabContent(player);
            };
            ottBody.appendChild(autoRow);

            if (tracks && tracks.length) {
              var heights = [];
              tracks.forEach(function(t) {
                if (t.height && heights.indexOf(t.height) === -1) heights.push(t.height);
              });
              heights.sort(function(a, b) { return b - a; });

              heights.forEach(function(h) {
                var isSelected = !isAbr && tracks.some(function(t) { return t.height === h && t.active; });
                var label = h >= 1080 ? "Full HD Up to " + h + "p" : h >= 720 ? "HD Up to " + h + "p" : "Data Saver (" + h + "p)";

                var row = document.createElement("div");
                row.className = "ott-option-row" + (isSelected ? " active" : "");
                row.innerHTML = `
                  <div class="ott-option-text">
                    <div class="ott-option-title">${h}p</div>
                    <div class="ott-option-sub">${label}</div>
                  </div>
                  <div class="ott-option-check"><i class="fa-solid fa-check"></i></div>
                `;
                row.onclick = function(e) {
                  e.stopPropagation();
                  var target = tracks.find(function(t) { return t.height === h; });
                  if (target) {
                    player.configure({ abr: { enabled: false } });
                    player.selectVariantTrack(target, true);
                    toast("Quality set to " + h + "p", "ok", 2000);
                  }
                  renderTabContent(player);
                };
                ottBody.appendChild(row);
              });

          } 
          else if (currentTab === "speed") {

              { val: 2.0, label: "2x" }

            speeds.forEach(function(s) {

              var row = document.createElement("div");
              row.className = "ott-option-row" + (isSelected ? " active" : "");
              row.innerHTML = `
                <div class="ott-option-text">
                  <div class="ott-option-title">${s.label}</div>
                </div>
                <div class="ott-option-check"><i class="fa-solid fa-check"></i></div>
              `;
              row.onclick = function(e) {
                e.stopPropagation();
                $vid.playbackRate = s.val;
                toast("Playback speed set to " + s.label, "ok", 2000);
                renderTabContent(player);
              };
              ottBody.appendChild(row);
            });
          }
          else if (currentTab === "audio") {
            // Dynamic Audio & Subtitle Detection
            var audioLangs = player.getAudioLanguages();
            var textTracks = player.getTextTracks();
            var currentAudio = player.getConfiguration().preferredAudioLanguage || (audioLangs[0] || "und");

            // Audio Section Header
            var audioTitle = document.createElement("div");
            audioTitle.className = "ott-section-title";
            audioTitle.textContent = "Live Stream Audio Languages";
            ottBody.appendChild(audioTitle);

            if (audioLangs && audioLangs.length) {
              audioLangs.forEach(function(lang) {
                var langName = getLangName(lang);
                var isSelected = (lang === currentAudio) || (audioLangs.length === 1);

                var row = document.createElement("div");
                row.className = "ott-option-row" + (isSelected ? " active" : "");
                row.innerHTML = `
                  <div class="ott-option-text">
                    <div class="ott-option-title">${langName}</div>
                    <div class="ott-option-sub">${isSelected ? "Currently Playing" : "Tap to Switch"}</div>
                  </div>
                  <div class="ott-option-check"><i class="fa-solid fa-check"></i></div>
                `;
                row.onclick = function(e) {
                  e.stopPropagation();
                  player.selectAudioLanguage(lang);
                  toast("Audio switched to " + langName, "ok", 2000);
                  renderTabContent(player);

            } else {
              var defaultRow = document.createElement("div");
              defaultRow.className = "ott-option-row active";
              defaultRow.innerHTML = `
                <div class="ott-option-text">
                  <div class="ott-option-title">Default Audio Stream</div>
                  <div class="ott-option-sub">Original Broadcaster Commentary</div>
                </div>
                <div class="ott-option-check"><i class="fa-solid fa-check"></i></div>
              `;
              ottBody.appendChild(defaultRow);

            // Subtitles Section

            subTitle.textContent = "Subtitles & Captions";

            if (textTracks && textTracks.length) {
              var offRow = document.createElement("div");

              offRow.className = "ott-option-row" + (!isTextEnabled ? " active" : "");

                <div class="ott-option-text">

        window.openOttSettings = function() {

      function setupPlayerGestures(targetFrame, video) {
        var startX = 0, startY = 0;
        var startBright = 100;
        var startVol = 1.0;
        var currentBrightness = 100;
        var isSwiping = false;
        var mode = "";
        var hudTimer = null;

        var lastTapTime = 0;
        var accumulatedSeek = 0;
        var seekResetTimer = null;
        var lastSeekDirection = null;

        var brOverlay = document.getElementById("brightness-overlay");
        var hudBright = document.getElementById("hud-brightness");
        var hudVol = document.getElementById("hud-volume");
        var hudBrightFill = document.getElementById("hud-brightness-fill");
        var hudVolFill = document.getElementById("hud-volume-fill");
        var hudVolIcon = document.getElementById("hud-vol-icon");

        var seekLeftHud = document.getElementById("seek-left");
        var seekRightHud = document.getElementById("seek-right");
        var seekLeftText = document.getElementById("seek-left-text");
        var seekRightText = document.getElementById("seek-right-text");

        function updateBrightnessHUD(val) {
          var p = Math.round(val);
          if (hudBrightFill) hudBrightFill.style.height = p + "%";
          if (hudVol) hudVol.style.display = "none";
          if (hudBright) {
            hudBright.style.display = "flex";
            if (hudTimer) clearTimeout(hudTimer);
            hudTimer = setTimeout(function() {
              hudBright.style.display = "none";
            }, 1000);
          }
        }

        function updateVolumeHUD(val) {
          var p = Math.round(val * 100);
          var fillHeight = Math.min((val / 2) * 100, 100);

          if (hudVolFill) hudVolFill.style.height = fillHeight + "%";

          if (hudVolIcon) {
            if (p === 0) {
              hudVolIcon.className = "fa-solid fa-volume-xmark";
            } else if (p <= 50) {
              hudVolIcon.className = "fa-solid fa-volume-low";
            } else {
              hudVolIcon.className = "fa-solid fa-volume-high";
            }
          }

          if (hudBright) hudBright.style.display = "none";
          if (hudVol) {
            hudVol.style.display = "flex";
            if (hudTimer) clearTimeout(hudTimer);
            hudTimer = setTimeout(function() {
              hudVol.style.display = "none";
            }, 1000);
          }
        }

        function showSideSeek(direction, seconds) {
          var targetEl = (direction === 'forward') ? seekRightHud : seekLeftHud;
          var targetText = (direction === 'forward') ? seekRightText : seekLeftText;
          var otherEl = (direction === 'forward') ? seekLeftHud : seekRightHud;

          if (otherEl) otherEl.style.display = "none";

          if (targetEl && targetText) {
            targetText.textContent = (direction === 'forward' ? '+' : '-') + seconds;
            targetEl.style.display = "flex";
          }
        }

        targetFrame.addEventListener("touchstart", function(e) {
          if (isInterfaceLocked) return;
          if (e.touches.length !== 1) return;

          var isControlsActive = targetFrame.querySelector(".shaka-controls-container")?.getAttribute("shown") === "true";
          if (isControlsActive && e.target.closest(".shaka-controls-button-panel, .shaka-range-container, .ott-settings-modal")) return;

          var touch = e.touches[0];
          startX = touch.clientX;
          startY = touch.clientY;
          startBright = currentBrightness;
          startVol = video.volume;
          isSwiping = true;
          mode = "";
        }, { passive: true });

        targetFrame.addEventListener("touchmove", function(e) {
          if (isInterfaceLocked) return;
          if (!isSwiping || e.touches.length !== 1) return;

          var touch = e.touches[0];
          var deltaX = touch.clientX - startX;
          var deltaY = touch.clientY - startY;

          if (!mode && Math.abs(deltaY) > 15 && Math.abs(deltaY) > Math.abs(deltaX)) {
            var viewWidth = targetFrame.clientWidth;
            if (startX < viewWidth / 2) mode = "brightness";
            else mode = "volume";
          }

          if (mode === "brightness") {
            var bChange = -(deltaY / (targetFrame.clientHeight * 0.8)) * 100;
            var nextBright = Math.min(Math.max(startBright + bChange, 10), 100);
            currentBrightness = nextBright;
            if (brOverlay) {
              brOverlay.style.opacity = (100 - currentBrightness) / 100;
            }
            updateBrightnessHUD(currentBrightness);
          } else if (mode === "volume") {
            var sensitivity = 0.8;
            var vChange = -(deltaY / (targetFrame.clientHeight * sensitivity));
            var virtualVolume = startVol + vChange;
            var dynamicLimit = Math.min(Math.max(virtualVolume, 0), 2);

            if (dynamicLimit <= 1.0) {
              setBoostedVolume(1.0);
              video.volume = dynamicLimit;
              if (dynamicLimit > 0) video.muted = false;
              updateVolumeHUD(dynamicLimit);
            } else {
              initializeAudioEngine(video);
              video.volume = 1.0;
              setBoostedVolume(dynamicLimit);
              updateVolumeHUD(dynamicLimit);
            }
          }
        }, { passive: true });

        targetFrame.addEventListener("touchend", function(e) {
          if (isInterfaceLocked) return;

          var currentTime = new Date().getTime();
          var tapInterval = currentTime - lastTapTime;

          if (tapInterval < 400 && tapInterval > 0 && e.changedTouches && e.changedTouches.length > 0) {
            var touchX = e.changedTouches[0].clientX;
            var screenWidth = targetFrame.clientWidth;
            var currentDirection = (touchX > screenWidth / 2) ? 'forward' : 'backward';

            if (lastSeekDirection !== currentDirection) {
              accumulatedSeek = 0;
            }

            lastSeekDirection = currentDirection;
            accumulatedSeek += 10;

            if (currentDirection === 'forward') {
              video.currentTime += 10;
              showSideSeek("forward", accumulatedSeek);
            } else {
              video.currentTime -= 10;
              showSideSeek("backward", accumulatedSeek);
            }

            if (seekResetTimer) clearTimeout(seekResetTimer);
            seekResetTimer = setTimeout(function() {
              accumulatedSeek = 0;
              lastSeekDirection = null;
              if (seekLeftHud) seekLeftHud.style.display = "none";
              if (seekRightHud) seekRightHud.style.display = "none";
            }, 1200);
          }

          lastTapTime = currentTime;
          isSwiping = false;
          mode = "";
        });

        // Screen tap handler for lock icon show/hide
        targetFrame.addEventListener("click", function(e) {
          if (isInterfaceLocked) {
            if (floatLockContainer.classList.contains("show")) {
              floatLockContainer.classList.remove("show");
              if (lockHideTimer) clearTimeout(lockHideTimer);
            } else {
              showFloatingLockTemp();
            }
          }
        });

        if (floatLock) {
          floatLock.onclick = function(e) {
            e.stopPropagation();
            isInterfaceLocked = false;
            $pc.classList.remove("controls-locked");
            floatLockContainer.classList.remove("show");
            if (lockHideTimer) clearTimeout(lockHideTimer);
            
            var panelLockBtn = document.querySelector(".sp-lock-btn");
            if (panelLockBtn) {
              panelLockBtn.innerHTML = UNLOCK_ICON;
              panelLockBtn.title = "Lock Controls";
            }

            toast("Controls Unlocked", "ok", 3000);
          };
        }
      }

        var conn = navigator.connection || navigator.mozConnection ||

        var net = conn ? (conn.effectiveType || "4g") : "4g";
        if (!mob) return "high";
        if (mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g")

        if (mem <= 3 || cores <= 4) return "mid";

      async function loadData() {
        var r = await fetch(API, {

          headers: {

          }

        if (!r.ok) throw new Error("HTTP " + r.status);
        var d = await r.json();
        if (!d || !Array.isArray(d.channels) || !d.channels.length)
          throw new Error("empty");

          4: "Manifest",
          5: "Streaming",

        if (e.data && e.data[0] && typeof e.data[0] === "string") s += " — " +
          e.data[0].slice(0, 72);

        var fitIdx = 0;

          fitBtn.title = "Video fit: " + MODE_LABEL[m];
        }
        fitBtn.addEventListener("click", function(e) {
          e.stopPropagation();
          applyFit((fitIdx + 1) % FITS.length);
        });
        ["fullscreenchange", "webkitfullscreenchange"].forEach(function(ev) {
          document.addEventListener(ev, function() {
            if (!(document.fullscreenElement || document
                .webkitFullscreenElement)) applyFit(0);
          });
        });

        // Universal Picture in Picture Handler
        var pipBtn = document.createElement("button");
        pipBtn.className = "sp-btn sp-pip-btn";
        pipBtn.title = "Picture in Picture";
        pipBtn.innerHTML = PIP_ICON;
        panel.insertBefore(pipBtn, fitBtn);

        function setPipState(active) {
          pipBtn.classList.toggle("active", active);
          pipBtn.title = active ? "Exit Picture in Picture" : "Picture in Picture";
        }

        pipBtn.addEventListener("click", async function(e) {
          e.stopPropagation();
          try {
            if (document.pictureInPictureEnabled && !vid.disablePictureInPicture) {
              if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
              } else {
                await vid.requestPictureInPicture();
              }
            } else if (vid.webkitSupportsPresentationMode && typeof vid.webkitSetPresentationMode === "function") {
              var targetMode = vid.webkitPresentationMode === "picture-in-picture" ? "inline" : "picture-in-picture";
              vid.webkitSetPresentationMode(targetMode);
            } else {
              toast("PiP not supported on this browser", "warn", 2500);
            }
          } catch (err) {
            toast("PiP execution failed", "warn", 2500);
          }
        });

        vid.addEventListener("enterpictureinpicture", function() {
          setPipState(true);
        });
        vid.addEventListener("leavepictureinpicture", function() {
          setPipState(false);
        });
        if (vid.webkitPresentationMode !== undefined) {
          vid.addEventListener("webkitpresentationmodechanged", function() {
            setPipState(vid.webkitPresentationMode === "picture-in-picture");
          });
        }

        setupOttSettings(player);
      }

      async function startPlayer(ch) {
        $pc.style.display = "flex";
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
          errMsg("Browser not supported.");
          return;
        }

        var player = new shaka.Player();
        await player.attach($vid);

        new shaka.ui.Overlay(player, $pc, $vid).configure({
          controlPanelElements: ["play_pause", "mute", "volume",
            "time_and_duration", "spacer", "fullscreen"
          ],
          seekBarColors: {
            base: "#fff",
            buffered: "#a8a8a8",
            played: "#2962ff"
          }
        });
        setTimeout(function() {
          injectControls($pc, $vid, player);
          setupPlayerGestures($pc, $vid);
        }, 100);

        var cookie = ch.cookie,
          raw = rawCookie(cookie);
        var keyId = ch.key_id,
          key = ch.key,
          url = ch.stream_url;

        var restrictionsRelaxed = false;

        function buildCfg() {
          var restr = {};
          if (!restrictionsRelaxed) {
            if (PROF.maxH < 1080) restr.maxHeight = PROF.maxH;
            if (PROF.maxBw > 0) restr.maxBandwidth = PROF.maxBw;
          }
          return {
            drm: {
              clearKeys: {
                [keyId]: key
              }
            },
            manifest: {
              defaultPresentationDelay: 3,
              ignoreTextStreamFailures: true,
              retryParameters: {
                maxAttempts: 10,
                baseDelay: 100,
                backoffFactor: 1.1,
                fuzzFactor: .1,
                timeout: 5000
              }
            },
            streaming: {
              lowLatencyMode: false,
              bufferingGoal: PROF.buf,
              rebufferingGoal: PROF.reBuf,
              bufferBehind: PROF.behind,
              safeSeekOffset: 3,
              stallEnabled: true,
              stallThreshold: 0.1,
              stallSkip: 0.2,
              inaccurateManifestTolerance: 0,
              alwaysStreamText: false,
              jumpLargeGaps: true,
              retryParameters: {
                maxAttempts: 10,
                baseDelay: 100,
                backoffFactor: 1.1,
                fuzzFactor: .1,
                timeout: 5000
              }
            },
            abr: {
              enabled: true,
              defaultBandwidthEstimate: PROF.bwEst,
              switchInterval: 0.5,
              bandwidthUpgradeTarget: 0.65,
              bandwidthDowngradeTarget: 0.98,
              restrictions: restr
            }
          };
        }

        player.configure(buildCfg());

        var T = shaka.net.NetworkingEngine.RequestType;
        player.getNetworkingEngine().registerRequestFilter(function(type,
          req) {
          req.headers["Referer"] = "https://www.jiotv.com/";
          req.headers["User-Agent"] =
            "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
          req.headers["Cookie"] = cookie;
          if (type === T.MANIFEST || type === T.SEGMENT)
            req.uris = req.uris.map(function(u) {
              return withCookie(u, raw);
            });
        });

        var refreshing = false,
          retries = 0,
          edgeTried = false,
          lastTry = 0,
          started = false;

        function unmuteOnce() {
          $vid.muted = false;
          initializeAudioEngine($vid);
        }
        $pc.addEventListener("pointerdown", unmuteOnce, {
          capture: true,
          once: true
        });
        $pc.addEventListener("click", unmuteOnce, {
          capture: true,
          once: true
        });
        $pc.addEventListener("keydown", unmuteOnce, {
          capture: true,
          once: true
        });

        function goLiveEdge() {
          if (refreshing) return;
          try {
            player.goToLive();
            edgeTried = true;
          } catch (_) {
            reload();
          }
        }

        async function reload() {
          var now = Date.now();
          if (refreshing || now - lastTry < 500) return;
          if (retries >= 8) {
            toast("Stream unavailable.", "err", 0);
            return;
          }
          refreshing = true;
          lastTry = now;
          retries++;
          
          try {
            var d = await loadData();
            var fresh = d.channels.find(function(c) {
              return c.id === ch.id;
            });
            if (!fresh) throw new Error("missing");
            cookie = fresh.cookie;
            raw = rawCookie(cookie);
            keyId = fresh.key_id;
            key = fresh.key;
            url = fresh.stream_url;
            player.configure(buildCfg());
            await player.load(url);
            $vid.play().catch(function() {});
            retries = 0;
            edgeTried = false;

          } catch (_) {
            setTimeout(reload, Math.min(300 * Math.pow(1.2, retries - 1),
              2000));
          } finally {
            refreshing = false;
          }
        }

        var RECOVERABLE = [1001, 1002, 1003, 4012, 6006, 6007, 7000, 7001,
          7002
        ];

        player.addEventListener("error", function(ev) {
          var err = ev.detail,
            code = err && err.code;
          if (code === 4014 && !restrictionsRelaxed) {
            restrictionsRelaxed = true;
            refreshing = true;
            player.configure(buildCfg());
            player.load(url)
              .then(function() {
                $vid.play().catch(function() {});

              })
              .catch(function() {
                reload();
              })
              .finally(function() {
                refreshing = false;
              });
            return;
          }

          if (RECOVERABLE.indexOf(code) !== -1) reload();
          else toast(shakaErrStr(err), "err", 6000);
        });

        try {

          await player.load(url);

        } catch (_) {
          setTimeout(reload, 500);
          return;
        }

        var stallTmr = null;

        function onStall() {
          if (refreshing) return;
          
          try {
            player.configure("abr.restrictions.maxHeight", 240);
          } catch (_) {}

          if ($vid.paused) {
            $vid.play().catch(function() {});
          }

          if (stallTmr) return;

          stallTmr = setTimeout(function() {
            stallTmr = null;
            if ($vid.readyState < 3) {
              if (!edgeTried) goLiveEdge();
              else reload();
            }
          }, 600);
        }

        function onPlaying() {
          started = true;
          if (stallTmr) {
            clearTimeout(stallTmr);
            stallTmr = null;
          }
          edgeTried = false;
        }
        $vid.addEventListener("waiting", onStall);
        $vid.addEventListener("stalled", onStall);
        $vid.addEventListener("playing", onPlaying);
        $vid.addEventListener("error", function() {
          if (!refreshing) reload();
        });

        document.addEventListener("visibilitychange", function() {
          if (!document.hidden) {
            setTimeout(function() {
              if (started && $vid.paused && !refreshing) $vid.play()
                .catch(function() {});
            }, 200);
          }
        });

        var netConn = navigator.connection || navigator.mozConnection ||
          navigator.webkitConnection;
        if (netConn) {
          netConn.addEventListener("change", function() {
            if (!player) return;
            var t = netConn.effectiveType || "4g";
            var h = (t === "slow-2g" || t === "2g") ? 240 : (t === "3g") ?
              360 : PROF.maxH;
            try {
              player.configure("abr.restrictions.maxHeight", h);
            } catch (_) {}
          });
        }
      }

      async function main() {
        var id = getChId(),
          data;
        try {
          data = await loadData();
        } catch (_) {
          errMsg("Server Disconnected..");
          return;
        }
        if (!id) {
          renderList(data.channels);
          return;
        }
        var ch = data.channels.find(function(c) {
          return c.id === id;
        });
        if (!ch) {
          errMsg("Channel not found.");
          return;
        }
        document.title = ch.name;
        await startPlayer(ch);
      }

      document.addEventListener("DOMContentLoaded", main);
    })();
  </script>
</body>
</html>
